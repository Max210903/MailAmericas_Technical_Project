version: 2

models:
  - name: dim_departamentos
    description: >
      Dimensión de departamentos: una fila por departamento oficial de Argentina (lista de Georef),
      con su provincia y ubicación. Las medidas del censo están en fct_radios_censales.
    columns:
      - name: codigo_departamento
        description: Código INDEC de 5 dígitos (2 de provincia + 3 de departamento).
        data_tests:
          - unique
          - not_null
      - name: nombre_departamento
      - name: codigo_provincia
        description: Código INDEC de provincia, 2 dígitos.
      - name: nombre_provincia
      - name: latitud
        description: Latitud del centroide del departamento (Georef).
      - name: longitud
        description: Longitud del centroide del departamento (Georef).
