version: 2

models:
  - name: rpt_top10_departamentos
    description: >
      Pregunta 1 del reporte: los 10 departamentos con más población en viviendas particulares,
      con su provincia, centroide y porcentaje sobre el total nacional.
    columns:
      - name: ranking
        description: Posición por población (1 = más poblado).
        data_tests:
          - unique
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: codigo_departamento
        description: Código INDEC de 5 dígitos.
        data_tests:
          - unique
          - not_null
      - name: nombre_departamento
      - name: nombre_provincia
      - name: latitud
        description: Latitud del centroide del departamento (Georef).
      - name: longitud
        description: Longitud del centroide del departamento (Georef).
      - name: poblacion
        description: Población en viviendas particulares.
      - name: porcentaje_poblacion_nacional
        description: Porcentaje de la población nacional en viviendas particulares, con 2 decimales.

  - name: rpt_poblacion_por_provincia
    description: >
      Pregunta 2 del reporte: población en viviendas particulares por provincia (24 jurisdicciones,
      incluida CABA) y su porcentaje sobre el total nacional.
    columns:
      - name: ranking
        description: Posición por población (1 = más poblada).
        data_tests:
          - unique
          - not_null
      - name: codigo_provincia
        description: Código INDEC de provincia, 2 dígitos.
        data_tests:
          - unique
          - not_null
      - name: nombre_provincia
      - name: departamentos
        description: Cantidad de departamentos de la provincia (lista de Georef).
      - name: poblacion
        description: Población en viviendas particulares.
      - name: porcentaje_poblacion_nacional
        description: Porcentaje de la población nacional en viviendas particulares, con 2 decimales.

  - name: rpt_concentracion_poblacion
    description: >
      Pregunta 3 del reporte: concentración de la población. Para cortes fijos (top 10, 20, 50 y 100
      departamentos) y para umbrales (50% y 80% de la población), cuántos departamentos son y qué
      porcentaje de la población reúnen.
    columns:
      - name: corte
        description: Descripción del corte o umbral.
        data_tests:
          - unique
          - not_null
      - name: departamentos
        description: Cantidad de departamentos más poblados incluidos en el corte.
        data_tests:
          - not_null
      - name: porcentaje_departamentos
        description: Porcentaje que representan sobre el total de departamentos, con 2 decimales.
      - name: porcentaje_poblacion
        description: Porcentaje de la población nacional que reúnen, con 2 decimales.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
