version: 2

models:
  - name: stg_georef__departamentos
    description: Un registro por departamento, con nombre, provincia y centroide.
    columns:
      - name: codigo_departamento
        description: Código INDEC de 5 dígitos (2 de provincia + 3 de departamento).
        data_tests:
          - unique
          - not_null
      - name: nombre_departamento
        data_tests:
          - not_null
      - name: codigo_provincia
        description: Código INDEC de provincia, 2 dígitos.
        data_tests:
          - not_null
      - name: nombre_provincia
        data_tests:
          - not_null
      - name: latitud
        description: Latitud del centroide del departamento.
        data_tests:
          - not_null
      - name: longitud
        description: Longitud del centroide del departamento.
        data_tests:
          - not_null
