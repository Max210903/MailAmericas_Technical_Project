version: 2

models:
  - name: stg_indec__radios_censales
    description: Un registro por radio censal, con su población y viviendas particulares (Censo 2022).
    columns:
      - name: codigo_radio
        description: Código del radio censal (provincia + departamento + fracción + radio).
        data_tests:
          - unique
          - not_null
      - name: codigo_provincia
        description: Código INDEC de provincia, 2 dígitos.
        data_tests:
          - not_null
      - name: codigo_departamento
        description: Código INDEC de 5 dígitos (2 de provincia + 3 de departamento).
        data_tests:
          - not_null
          - relationships:
              name: radios_departamento_existe_en_georef
              arguments:
                to: ref('stg_georef__departamentos')
                field: codigo_departamento
      - name: poblacion
        description: Población en viviendas particulares del radio.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_indec__censo_hogares
    description: >
      Hogares por radio censal, variable y categoría (Censo 2022), solo para las variables de la métrica
      de e-commerce. Usar codigo_categoria y no el texto de categoria: el "sí" está escrito distinto según la variable.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_radio, variable, codigo_categoria]
    columns:
      - name: codigo_radio
        data_tests:
          - not_null
      - name: codigo_departamento
        description: Código INDEC de 5 dígitos (2 de provincia + 3 de departamento).
        data_tests:
          - not_null
          - relationships:
              name: hogares_departamento_existe_en_georef
              arguments:
                to: ref('stg_georef__departamentos')
                field: codigo_departamento
      - name: variable
        description: >
          HOGAR_H24A internet en la vivienda; HOGAR_H24B celular con internet;
          HOGAR_H24C computadora o tablet; HOGAR_IPMH índice de privación material.
        data_tests:
          - accepted_values:
              arguments:
                values: [HOGAR_H24A, HOGAR_H24B, HOGAR_H24C, HOGAR_IPMH]
      - name: codigo_categoria
        description: >
          H24A/B/C: 1 = sí, 2 = no. IPMH: 1 = sin privación, 2 = solo recursos corrientes,
          3 = solo recursos patrimoniales, 4 = convergente.
        data_tests:
          - not_null
      - name: hogares
        description: Cantidad de hogares del radio en esa categoría.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
