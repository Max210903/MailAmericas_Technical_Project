name: mailamericas-airflow

x-airflow-common: &airflow-common
  build:
    context: .
  image: mailamericas-airflow:2.11.2
  # UID del usuario de WSL para que los archivos en airflow/logs no queden como root
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-secret}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Conexión "warehouse_default" (mismos valores por defecto que docker/warehouse/docker-compose.yml)
    AIRFLOW_CONN_WAREHOUSE_DEFAULT: postgresql://${WAREHOUSE_DB_USER:-warehouse}:${WAREHOUSE_DB_PASSWORD:-warehouse}@warehouse-db:5432/warehouse
    # dbt busca profiles.yml en el propio proyecto
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/plugins:/opt/airflow/plugins
    - ../../airflow/logs:/opt/airflow/logs
    - ../../dbt:/opt/airflow/dbt

services:
  airflow-db:
    image: postgres:16
    container_name: mailamericas-airflow-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Migra la base de metadatos y crea el usuario admin; termina y no se reinicia.
  airflow-init:
    <<: *airflow-common
    container_name: mailamericas-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: mailamericas-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: mailamericas-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow_db_data:
